name: bootstrap-01
# 胶囊点火件(cisvr 直装,vinf 三请之答):验证仓内金库钥可铸 App token + 仓写回闭环。
# 纪律:无远端拉取执行;secrets 按名引用;E912 已本地 safe_load。
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ignite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.CI_OPS_APP_ID }}
          private-key: ${{ secrets.CI_OPS_APP_KEY }}
          owner: chepin-ai
      - name: ignite-ack writeback
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -e
          git config user.name "vinf-bootstrap"
          git config user.email "bootstrap@ci-os.local"
          mkdir -p bridge
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ignite":"ok","ts":"%s","run_id":"%s","by":"cisvr-bootstrap-01","line":"vinf"}' "$TS" "${{ github.run_id }}" > bridge/ignite-ack.json
          git add bridge/ignite-ack.json
          git commit -m "ignite-ack: bootstrap-01 first fire ($TS)"
          git push
