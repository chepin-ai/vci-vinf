name: SI3-LOOP-11 (vinf场感应-迭代 orchestrator·圈层网塔·直通场·瞬传·覆写权归各线)
'on':
  workflow_dispatch:
    inputs:
      seed_line: {description: '目标线(qtlv/lgt/usrm/qfa)', required: false, default: ''}
      seed_question: {description: '迭代种子问', required: false, default: ''}
      max_cycles: {description: '圈预算', required: false, default: '4'}
      rescan_minutes: {description: '回补扫窗(分钟)', required: false, default: '0'}
      reopen_tid: {description: '重审线程id', required: false, default: ''}
  push:
    paths: ['inbox/**']
  workflow_run:
    workflows: ["SELF-EXCITE-03 (vinf SI1语义自激轨·统一正位·dedupe+真重试+态生SELF-Q·supersedes 01/02)", "relay-writer-01"]
    types: [completed]
concurrency:
  group: si3-loop-federation
  cancel-in-progress: false
permissions:
  contents: write
env:
  AI_FULL_PAT: ${{ secrets.AI_FULL_PAT }}
  LINE_PAT: ${{ secrets.LINE_PAT }}
  FED_PAT: ${{ secrets.FED_PAT }}
  QI_PAT: ${{ secrets.QI_PAT }}
  CI_OPS_LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  GH_OWN: ${{ github.token }}
  SEED_LINE: ${{ inputs.seed_line }}
  SEED_QUESTION: ${{ inputs.seed_question }}
  MAX_CYCLES: ${{ inputs.max_cycles }}
  RESCAN_MINUTES: ${{ inputs.rescan_minutes }}
  REOPEN_TID: ${{ inputs.reopen_tid }}
jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: si3-loop
        run: |
          python3 - <<'PYEOF'
          import os, json, base64, time, re, io, zipfile, subprocess, urllib.request, urllib.error, datetime, uuid
          ts0=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
          nonce=uuid.uuid4().hex[:12]
          LINES=['vci-lgt','vci-usrm','vci-qfa','vci-qtlv','vci-ucif2','vci-qgl','vci-cfts']
          ORG='chepin-ai'
          receipt={'op':'SI3-LOOP-11','ts':ts0,'nonce':nonce,'phases':{}}
          def api(tok,method,url,body=None,raw=False):
              r=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              d=json.dumps(body).encode() if body is not None else None
              try:
                  with urllib.request.urlopen(r,d,timeout=40) as resp:
                      data=resp.read()
                      return resp.status,(data if raw else (json.loads(data) if data else {}))
              except urllib.error.HTTPError as e: return e.code,{} 
              except Exception: return -1,{}
          # ---- Phase A 探障: token x repo 名级矩阵(actions道) ----
          toks=[('AI_FULL_PAT',os.environ.get('AI_FULL_PAT','')),('LINE_PAT',os.environ.get('LINE_PAT','')),('FED_PAT',os.environ.get('FED_PAT','')),('QI_PAT',os.environ.get('QI_PAT',''))]
          matrix={}; readtok={}
          for repo in LINES:
              matrix[repo]={}
              for tn,tv in toks:
                  if not tv: matrix[repo][tn]='ABSENT'; continue
                  st,_=api(tv,'GET','https://api.github.com/repos/%s/%s/actions/workflows?per_page=1'%(ORG,repo))
                  matrix[repo][tn]=st
                  if st==200 and repo not in readtok: readtok[repo]=tv
          receipt['phases']['A_probe_matrix']=matrix
          # ---- state ----
          os.makedirs('si',exist_ok=True); os.makedirs('inbox',exist_ok=True)
          stf='si/si3-loop-state.json'
          try: stt=json.load(open(stf))
          except Exception: stt={'runs_seen':{},'threads':{},'history':[]}
          _rt=os.environ.get('REOPEN_TID','').strip()
          if _rt and _rt in stt.get('threads',{}):
              stt['threads'][_rt]['status']='OPEN'; stt['threads'][_rt]['mode']='confirm'
          for _t in stt.get('threads',{}).values():
              if _t.get('answers'):
                  _sn=set(); _dd=[]
                  for _a in _t['answers']:
                      _k=(_a.get('run'),_a.get('ans_fp'))
                      if _k not in _sn: _sn.add(_k); _dd.append(_a)
                  _t['answers']=_dd
          # ---- LLM (LLM-PARAM-01 裸body律: kimi迭代→deepseek) ----
          def llm(question,context):
              key=os.environ.get('KIMI_API_KEY','')
              if key:
                  H={'Authorization':'Bearer '+key,'Content-Type':'application/json'}
                  try:
                      with urllib.request.urlopen(urllib.request.Request('https://api.moonshot.cn/v1/models',headers=H),timeout=20) as r:
                          cands=[m['id'] for m in json.loads(r.read()).get('data',[])]
                  except Exception: cands=[]
                  for model in cands[:6]:
                      body={'model':model,'messages':[{'role':'system','content':'你是vinf线SI3-LOOP迭代裁决席(圈-层-网塔之L3)。以联邦纪律(诚实缺口/代码才判决A2/T9/负结果入册)裁决,中文,精炼。'+context},{'role':'user','content':question}]}
                      try:
                          rq=urllib.request.Request('https://api.moonshot.cn/v1/chat/completions',data=json.dumps(body).encode(),headers=H)
                          with urllib.request.urlopen(rq,timeout=60) as r:
                              d=json.loads(r.read()); return {'engine':'kimi','model':model,'answer':d['choices'][0]['message']['content']}
                      except Exception: continue
              dk=os.environ.get('DEEPSEEK_API_KEY','')
              if dk:
                  H={'Authorization':'Bearer '+dk,'Content-Type':'application/json'}
                  body={'model':'deepseek-chat','messages':[{'role':'system','content':'你是vinf线SI3-LOOP迭代裁决席。'+context},{'role':'user','content':question}]}
                  try:
                      rq=urllib.request.Request('https://api.deepseek.com/v1/chat/completions',data=json.dumps(body).encode(),headers=H)
                      with urllib.request.urlopen(rq,timeout=60) as r:
                          d=json.loads(r.read()); return {'engine':'deepseek','model':'deepseek-chat','answer':d['choices'][0]['message']['content']}
                  except Exception as e: return {'engine':'none','error':type(e).__name__}
              return {'engine':'none'}
          # ---- Phase B 场感应(TN-fp-diff·actions道·暗窗免疫) ----
          def sense(repo,tok):
              out={'new_runs':[],'answers':[]}
              st,wfs=api(tok,'GET','https://api.github.com/repos/%s/%s/actions/workflows?per_page=100'%(ORG,repo))
              if st!=200: out['wf_status']=st; return out
              ids=[w['id'] for w in wfs.get('workflows',[]) if 'semantic-responder' in w['path'] or 'self-excite-03' in w['path']]
              seen=set(stt['runs_seen'].get(repo,[]))
              for wid in ids:
                  st,runs=api(tok,'GET','https://api.github.com/repos/%s/%s/actions/workflows/%s/runs?per_page=3'%(ORG,repo,wid))
                  if st!=200: continue
                  rmin=float(os.environ.get('RESCAN_MINUTES','0') or 0)
                  for run in runs.get('workflow_runs',[]):
                      rid=run['id']
                      if run.get('status')!='completed': out['new_runs'].append({'id':rid,'event':run.get('event'),'status':run.get('status'),'wf':wid}); continue
                      if rid in seen:
                          _ok=False
                          if rmin>0:
                              try:
                                  _ct=datetime.datetime.strptime(run.get('created_at',''),'%Y-%m-%dT%H:%M:%SZ')
                                  _ok=(datetime.datetime.utcnow()-_ct).total_seconds()<rmin*60
                              except Exception: pass
                          if not _ok: continue
                      seen.add(rid)
                      stl,logs=api(tok,'GET','https://api.github.com/repos/%s/%s/actions/runs/%s/logs'%(ORG,repo,rid),raw=True)
                      recs=[]
                      if stl==200:
                          try:
                              z=zipfile.ZipFile(io.BytesIO(logs))
                              for nm in z.namelist():
                                  txt=z.read(nm).decode('utf-8','replace')
                                  for m in re.findall(r'\{"line":[^\n]*',txt):
                                      try: recs.append(json.loads(m))
                                      except Exception: pass
                          except Exception: pass
                      ent={'id':rid,'event':run.get('event'),'status':'completed','conclusion':run.get('conclusion'),'wf':wid,'created_at':run.get('created_at'),'receipts':recs}
                      out['new_runs'].append(ent)
                      for rc in recs:
                          for s in rc.get('sem',[]):
                              out['answers'].append({'run':rid,'event':run.get('event'),'created_at':run.get('created_at'),'card':s.get('card'),'ans_fp':s.get('ans_fp'),'model':s.get('model'),'ans_head':(s.get('ans_head') or '')[:300]})
              stt['runs_seen'][repo]=list(seen)[-200:]
              return out
          field={}
          for repo in LINES:
              if repo in readtok: field[repo]=sense(repo,readtok[repo])
              else: field[repo]={'gap':'NO-READ-LANE(诚实缺口)'}
          # 自感(vinf自身,GH_OWN)
          try: field['vci-vinf']=sense('vci-vinf',os.environ['GH_OWN'])
          except Exception as e: field['vci-vinf']={'gap':type(e).__name__}
          receipt['phases']['B_field_sense']={k:{'new_runs':len(v.get('new_runs',[])),'answers':len(v.get('answers',[])),'gap':v.get('gap')} for k,v in field.items()}
          # ---- Phase C 线程归并: 新答件挂靠OPEN线程 ----
          for repo,v in field.items():
              line=repo.replace('vci-','')
              for a in v.get('answers',[]):
                  card=a.get('card') or ''
                  mt=re.search(r'(SI3-SEED-\d{8}T\d{6}Z)',card) or re.search(r'(SI3-[\w\-]+?)(?:\.md)?$',card)
                  tid=mt.group(1) if mt else None
                  if not tid: 
                      for t_id,t in stt['threads'].items():
                          if t.get('last_card')==card or t.get('seed_card')==card: tid=t_id; break
                  if tid and tid in stt['threads']:
                      _ex=stt['threads'][tid].setdefault('answers',[])
                      if (a.get('run'),a.get('ans_fp')) not in {(x.get('run'),x.get('ans_fp')) for x in _ex}: _ex.append(a)
          # ---- Phase D 直通场(CI_OPS直创·无hub·create-only) ----
          ci=os.environ.get('CI_OPS_LINE_KEY','')
          def put_card(line,tid,question,prev,iter_no=0):
              stamp=datetime.datetime.utcnow().strftime('%H%M%S')
              card_nm='SI3-ITER-%s-i%d-%s.md'%(tid,iter_no,stamp)
              bodymd='# SI3-LOOP 迭代件\nCLASSIFY: SI3-LOOP/ITER\nthread: %s\n\n```json\n%s\n```\n'%(tid,json.dumps({'task_id':tid,'classify':'SI3-LOOP/ITER','thread':tid,'ask':question,'output':'outbox/ANS-SI3-%s.md'%tid,'reply_to':prev or ''},ensure_ascii=False))
              pl=base64.b64encode(bodymd.encode()).decode()
              t_put=datetime.datetime.utcnow().strftime('%H:%M:%SZ')
              st,resp=api(ci,'PUT','https://api.github.com/repos/%s/vci-%s/contents/inbox/%s'%(ORG,line,card_nm),{'message':'SI3-LOOP iter %s [nonce %s]'%(tid,nonce),'content':pl})
              if st in (409,422):
                  card_nm='SI3-ITER-%s-i%d-%s-%s.md'%(tid,iter_no,stamp,nonce[:6])
                  st,resp=api(ci,'PUT','https://api.github.com/repos/%s/vci-%s/contents/inbox/%s'%(ORG,line,card_nm),{'message':'SI3-LOOP iter %s [nonce %s]'%(tid,nonce),'content':pl})
              return st,card_nm,t_put
          hops=[]
          def fire_iter(tid,t,question):
              line=t['line']; prev=(t.get('answers') or [{}])[-1].get('ans_fp','') if t.get('answers') else ''
              stc,card_nm,t_put=put_card(line,tid,question,prev,t.get('iterations',0))
              t['last_card']=card_nm; t.setdefault('puts',[]).append({'card':card_nm,'st':stc,'t_put':t_put})
              hops.append({'tid':tid,'line':line,'card':card_nm,'put':stc,'t_put':t_put})
              return stc
          # 种子线程(dispatch)
          sl=os.environ.get('SEED_LINE','').strip(); sq=os.environ.get('SEED_QUESTION','').strip()
          if sl and sq:
              tid='SI3-SEED-'+ts0
              stt['threads'][tid]={'line':sl,'question':sq,'status':'OPEN','born':ts0,'iterations':0,'answers':[]}
              fire_iter(tid,stt['threads'][tid],sq)
              receipt['seed']={'tid':tid,'line':sl}
          # OPEN线程的新答→LLM裁决→未收敛续迭代
          def aggregate_and_confirm(tid,t):
              heads='\n---\n'.join('[%d] fp %s (%s): %s'%(i+1,a.get('ans_fp'),a.get('model'),(a.get('ans_head') or '')[:300]) for i,a in enumerate(t['answers'][-6:]))
              v=llm('线程问题:\n%s\n\n各轮答件(共%d轮):\n%s\n\n请执行聚合-确认:1)aggregated_final(汇总各轮为一致FINAL版,≤450字,去重保真,行线立场归原线) 2)confirm_question(请原线确认或修正,≤120字)。严格JSON单行输出。'%(t['question'],len(t['answers']),heads),'你是L3聚合席:汇总不改判,覆写权归原线;聚合版须保留各轮可机判要素。')
              t['agg_engine']=v.get('engine')+'/'+v.get('model','')
              ma=re.search(r'"aggregated_final"\s*:\s*"(.*?)"\s*[,}]',v.get('answer',''),re.S)
              mq=re.search(r'"confirm_question"\s*:\s*"(.*?)"',v.get('answer',''),re.S)
              agg=(ma.group(1)[:600] if ma else v.get('answer','')[:500])
              t['aggregated_final']=agg
              cq=(mq.group(1)[:200] if mq else '请确认聚合版是否代表你线立场')
              t['mode']='confirm'
              t['iterations']=t.get('iterations',0)+1
              fire_iter(tid,t,'【L3聚合-确认】'+cq+'\n\n聚合版FINAL(覆写权归你线,可修正):\n'+agg)
          def judge(tid,t):
              last=t['answers'][-1]
              if t.get('iterations',0)>=8:
                  t['status']='CONVERGED(附条件入册·NR-LOOP-LIVELOCK-01防护)'; t['closed']=ts0
                  t.setdefault('conditions','实采通道复测→联邦测量backlog;聚合忠实性已经原线两度确认')
                  return
              if t.get('mode')=='confirm':
                  ah=(last.get('ans_head') or '')
                  vc=llm('原线对聚合版的答件:\n%s\n\n裁决:该答件是无保留确认,还是附条件/拒绝硬收敛?输出{"confirm":true/false,"conditions":"≤150字(无则空)"}严格JSON单行。'%ah[:400],'NR-LOOP-SURFACECLOSE-01:确认判定须语义裁决,禁token表面匹配;附条件确认=confirm false+条件入册。')
                  t['confirm_engine']=vc.get('engine')+'/'+vc.get('model','')
                  mc=re.search(r'"confirm"\s*:\s*(true|false)',vc.get('answer',''))
                  if mc and mc.group(1)=='true':
                      t['status']='CONVERGED(聚合-确认)'; t['closed']=ts0; return
                  mcnd=re.search(r'"conditions"\s*:\s*"(.*?)"',vc.get('answer',''),re.S)
                  t['conditions']=(mcnd.group(1)[:200] if mcnd else '')
                  t['mode']=None
                  if ('原卡' in t.get('conditions','') or '原卡' in ah) and not t.get('original_delivered'):
                      t['original_delivered']=True
                      t['iterations']=t.get('iterations',0)+1
                      fire_iter(tid,t,'【L3应你线要求·补录原卡原文(一次性)】:\n'+t['question']+'\n\n请据原卡终审聚合版FINAL;另:轮3模拟数据件已录入联邦测量backlog(实采复测),不阻塞本次忠实性收敛。')
                  else:
                      t['status']='CONVERGED(附条件入册)'; t['closed']=ts0
                  return
              v=llm('线程问题:\n%s\n\n最新答(fp %s, %s):\n%s\n\n请裁决:1)converged(true/false/conditional):true=完整无保留;conditional=答件忠实完整但附外部条件(如实采通道)而拒绝硬收敛——此属合法终态,条件入conditions;false=有实质缺口 2)reason(≤80字) 3)conditions(无则空) 4)next_question(false时必填,≤150字)。严格JSON单行输出。'%(t['question'],last.get('ans_fp'),last.get('model'),last.get('ans_head')),'裁决口径:收敛=完整应答+可机判要素;防过度迭代——已完整即true,勿为新增量续问;原线以纪律为由附外部条件者判conditional,条件入册即闭环,不强行硬收敛。')
              t['verdict']=v.get('answer','')[:400]; t['verdict_engine']=v.get('engine')+'/'+v.get('model','')
              cv='false'
              mc=re.search(r'"converged"\s*:?\s*"?(true|false|conditional)"?',v.get('answer',''))
              if mc: cv=[g for g in mc.groups() if g][0]
              if cv=='true': t['status']='CONVERGED'; t['closed']=ts0
              elif cv=='conditional':
                  mcnd=re.search(r'"conditions"\s*:\s*"(.*?)"',v.get('answer',''),re.S)
                  t['conditions']=(mcnd.group(1)[:200] if mcnd else t.get('conditions',''))
                  t['status']='CONVERGED(附条件入册)'; t['closed']=ts0
              elif len(t.get('answers',[]))>=2:
                  aggregate_and_confirm(tid,t)
              else:
                  mq=re.search(r'"next_question"\s*:\s*"(.*?)"',v.get('answer',''),re.S)
                  nq=mq.group(1)[:300] if mq else '请补全上答缺口:给出可机判要素。'
                  if t.get('iterations',0)<int(os.environ.get('MAX_CYCLES','4') or 4):
                      t['iterations']=t.get('iterations',0)+1
                      fire_iter(tid,t,nq)
                  else:
                      t['status']='ESCALATE(塔:>预算未收敛,录root批窗清单,不自动扰root)'
          for tid,t in list(stt['threads'].items()):
              if t.get('status')!='OPEN' or not t.get('answers'): continue
              judge(tid,t)
          # ---- Phase E 圈: 在环等待-复感-迭代(事件起动·预算有界·非驻留定时) ----
          cyc=int(os.environ.get('MAX_CYCLES','4') or 4)
          open_t=[tid for tid,t in stt['threads'].items() if t.get('status')=='OPEN' and t.get('puts')]
          for c in range(cyc):
              if not open_t: break
              time.sleep(90)
              for tid in list(open_t):
                  t=stt['threads'][tid]; repo='vci-'+t['line']
                  if repo not in readtok: continue
                  v2=sense(repo,readtok[repo])
                  new_ans=[a for a in v2.get('answers',[]) if a.get('card')==t.get('last_card') or (t.get('last_card','').replace('.md','') in (a.get('card') or ''))]
                  _ex=t.setdefault('answers',[])
                  new_ans=[a for a in new_ans if (a.get('run'),a.get('ans_fp')) not in {(x.get('run'),x.get('ans_fp')) for x in _ex}]
                  for a in new_ans:
                      a['dt_s']=None
                      try:
                          tp=datetime.datetime.strptime(t['puts'][-1]['t_put'],'%H:%M:%SZ'); ta=datetime.datetime.strptime(a['created_at'][11:19]+'Z','%H:%M:%SZ')
                          a['dt_s']=(ta-tp).seconds
                      except Exception: pass
                      t.setdefault('answers',[]).append(a)
                  if new_ans:
                      a=new_ans[-1]
                      hops.append({'tid':tid,'line':t['line'],'ans_fp':a.get('ans_fp'),'event':a.get('event'),'dt_s':a.get('dt_s'),'model':a.get('model')})
                      judge(tid,t)
                      if t.get('status')!='OPEN' and tid in open_t: open_t.remove(tid)
          receipt['hops']=hops
          receipt['threads']={tid:{'line':t['line'],'status':t['status'],'iter':t.get('iterations',0),'answers':len(t.get('answers',[])),'engine':t.get('verdict_engine','')} for tid,t in stt['threads'].items()}
          # ---- commit state(真重试律) ----
          stt['history']=(stt.get('history',[])+[{'ts':ts0,'nonce':nonce,'hops':len(hops),'threads':len(stt['threads'])}])[-20:]
          json.dump(stt,open(stf,'w'),ensure_ascii=False,indent=1)
          subprocess.run(['git','config','user.email','si3-loop@vinf.fed']); subprocess.run(['git','config','user.name','SI3-LOOP-01'])
          subprocess.run(['git','add',stf])
          push='skip'
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','SI3-LOOP-11 state %s [nonce %s]'%(ts0,nonce)],capture_output=True)
              push='fail'; _ok=False
              for _try in range(2):
                  subprocess.run(['git','fetch','-q','origin','main'])
                  if subprocess.run(['git','rebase','origin/main'],capture_output=True).returncode!=0:
                      subprocess.run(['git','rebase','--abort'],capture_output=True); continue
                  if subprocess.run(['git','push','-q','origin','HEAD:main'],capture_output=True).returncode==0:
                      _ok=True; break
              if not _ok:
                  subprocess.run(['git','fetch','-q','origin','main'])
                  subprocess.run(['git','reset','--hard','origin/main'],capture_output=True)
                  json.dump(stt,open(stf,'w'),ensure_ascii=False,indent=1)
                  subprocess.run(['git','add',stf])
                  subprocess.run(['git','commit','-m','SI3-LOOP-11 state %s [nonce %s]'%(ts0,nonce)],capture_output=True)
                  if subprocess.run(['git','push','-q','origin','HEAD:main'],capture_output=True).returncode==0: _ok=True
              push='ok' if _ok else 'fail'
          receipt['push']=push
          receipt['law']='圈(在环迭代有界)·层(L1机/L2语义/L3裁决)·网(5线fp-diff)·塔(预算尽升级不扰root)·直通场(CI_OPS直创无hub)·瞬传(push点火测Δt)·名可见值不见·纯事件起动非驻留'
          print(json.dumps(receipt,ensure_ascii=False))
          PYEOF
