name: KEY-PROVISION-02 (qtlv LLM钥装注·root拍31当面令·sealed-box内存直封·名级回执·pip独立步)
'on':
  workflow_dispatch: {}
jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      AI_FULL_PAT: ${{ secrets.AI_FULL_PAT }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - run: python3 -m pip install pynacl
      - run: |
          python3 - <<'PYEOF'
          import os, json, base64, urllib.request
          TGT='chepin-ai/vci-qtlv'
          P=os.environ['AI_FULL_PAT']
          def api(m,p,body=None):
              r=urllib.request.Request('https://api.github.com'+p,method=m,headers={'Authorization':'Bearer '+P,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              d=json.dumps(body).encode() if body is not None else None
              try:
                  with urllib.request.urlopen(r,d) as resp: return resp.status,json.loads(resp.read() or b'{}')
              except urllib.error.HTTPError as e: return e.code,{}
          receipt={'op':'KEY-PROVISION-02','target':TGT,'steps':[]}
          try:
              st,perm=api('GET','/repos/%s'%TGT)
              receipt['steps'].append({'repo_access':st,'permissions':perm.get('permissions',{})})
              st,sec=api('GET','/repos/%s/actions/secrets'%TGT)
              names=[s['name'] for s in sec.get('secrets',[])] if st==200 else []
              receipt['steps'].append({'secrets_list':st,'present_llm':[n for n in names if 'KIMI' in n or 'DEEPSEEK' in n or 'LONGCAT' in n]})
              st,pk=api('GET','/repos/%s/actions/secrets/public-key'%TGT)
              receipt['steps'].append({'public_key':st,'key_id':pk.get('key_id','')[:8]+'…' if st==200 else None})
              if st==200:
                  from nacl.public import SealedBox, PublicKey
                  import nacl.encoding
                  box=SealedBox(PublicKey(pk['key'].encode(), nacl.encoding.Base64Encoder))
                  for nm in ('KIMI_API_KEY','DEEPSEEK_API_KEY'):
                      if nm in names:
                          receipt['steps'].append({nm:'SKIP-EXISTS(增不覆写)'}); continue
                      val=os.environ.get(nm,'')
                      if not val:
                          receipt['steps'].append({nm:'SOURCE-ABSENT(诚实缺口)'}); continue
                      enc=base64.b64encode(box.encrypt(val.encode())).decode()
                      val=None  # 瞬时使用即焚
                      st2,_=api('PUT','/repos/%s/actions/secrets/%s'%(TGT,nm),{'encrypted_value':enc,'key_id':pk['key_id']})
                      enc=None
                      receipt['steps'].append({nm:'PUT %s'%st2})
              st,sec2=api('GET','/repos/%s/actions/secrets'%TGT)
              names2=[s['name'] for s in sec2.get('secrets',[])] if st==200 else []
              receipt['verify']={'present_llm_after':[n for n in names2 if 'KIMI' in n or 'DEEPSEEK' in n or 'LONGCAT' in n]}
          except Exception as ex:
              receipt['error']=type(ex).__name__
          receipt['law']='名可见值不见;值全程runner内存即焚;事件轨入链#324编年ch338'
          print(json.dumps(receipt,ensure_ascii=False))
          PYEOF
