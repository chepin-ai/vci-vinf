name: compute-g2
on:
  workflow_dispatch:
    inputs:
      L:
        description: 'lattice L (64=validation, 384=target)'
        default: '64'
      jobs:
        description: 'JSON [[p,seed],...]'
        default: '[[0.2,201],[0.22,202],[0.23729,203]]'
permissions:
  contents: write
jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy
      - name: run engine
        run: python3 compute/g2_engine.py ${{ inputs.L }} '${{ inputs.jobs }}' > result.json
      - name: commit result
        run: |
          git config user.email "vinf-si@users.noreply.github.com"
          git config user.name "vinf-si"
          mkdir -p compute/results
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          cp result.json compute/results/G2XI-L${{ inputs.L }}-$TS.json
          git add compute/results/
          git commit -m "G2XI v3 L${{ inputs.L }} $TS [skip ci]" || echo "nothing to commit"
          git push
      - uses: actions/upload-artifact@v4
        with: {name: g2-result, path: result.json}
